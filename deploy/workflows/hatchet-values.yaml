# Helm values for hatchet/hatchet-stack 0.19.0 (engine v0.107.0), installed by
# provision.sh into namespace `hatchet` on the notebook-kernels cluster.
#
# - Postgres is Cloud SQL (private IP), created by provision.sh, which passes
#   DATABASE_URL from the HATCHET_DATABASE_URL secret. Not Neon: see the README.
# - No RabbitMQ: Hatchet uses Postgres as its queue.
# - Nothing is exposed outside the cluster. Workers reach the engine over
#   in-cluster gRPC; the Mako API reaches the REST API on pod IPs over the VPC
#   (the same path it uses for kernel gateways); staff reach the dashboard with
#   `kubectl -n hatchet port-forward svc/caddy 8080:8080`.
sharedConfig:
  image:
    tag: "v0.107.0"
  serverUrl: "http://hatchet-api.hatchet.svc.cluster.local:8080"
  serverAuthCookieDomain: "localhost:8080"
  serverAuthCookieInsecure: "t"
  serverAuthSetEmailVerified: "t"
  serverAuthBasicAuthEnabled: "t"
  grpcBroadcastAddress: "hatchet-engine.hatchet.svc.cluster.local:7070"
  grpcInsecure: "t"
  defaultAdminEmail: "workflows-admin@mako.ai"
  # defaultAdminPassword and env.DATABASE_URL are passed with --set by provision.sh.
  env:
    SERVER_MSGQUEUE_KIND: "postgres"

# Two of each, and a disruption budget that keeps one up. The chart's own
# size (250m CPU and 1Gi requested each) is enough: at the worst of
# 2026-11-16 each used 0.1 CPU and 60 MB. What they need is a database that
# answers (provision.sh, SQL_TIER).
#
# With one pod each, any restart was an outage. On 2026-11-16 a manual
# rollout at 19:41 and a cluster-autoscaler eviction at 19:57 left no pod
# to answer, and the runs list returned 56 x 500. Two replicas keep one
# serving through a rolling update (maxUnavailable rounds to 0). The budget
# (minAvailable: 1) makes the autoscaler and node drains evict one at a time.
#
# The probes are the chart's with more patience. Both `/api/live` and the
# engine's `/live` ask the database, and Kubernetes' defaults (1 s timeout,
# 3 failures) restart the pod after 15 s of a slow database. On 2026-11-16
# that turned a busy database into an unreachable Hatchet: 38 restarts of
# the API and 19 of the engine, each dropping every worker's connection.
# A restart does not make a database faster; now only a pod that has not
# answered for a minute is restarted.
api:
  replicaCount: 2
  podDisruptionBudget:
    minAvailable: 1
  health:
    spec:
      livenessProbe:
        timeoutSeconds: 5
        failureThreshold: 12
      readinessProbe:
        timeoutSeconds: 5

engine:
  replicaCount: 2
  podDisruptionBudget:
    minAvailable: 1
  health:
    spec:
      livenessProbe:
        timeoutSeconds: 5
        failureThreshold: 12
      readinessProbe:
        timeoutSeconds: 5

postgres:
  enabled: false

rabbitmq:
  enabled: false

# In-cluster proxy that puts the dashboard and the API on one origin, which the
# dashboard needs. ClusterIP only; staff reach it with a port-forward.
caddy:
  enabled: true
  service:
    # The chart defaults to LoadBalancer, which would give Hatchet a public IP.
    type: ClusterIP
