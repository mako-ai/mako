name: Build & publish workflows runtime image

# Builds the workflows runtime image (deploy/workflows/runtime): the Hatchet
# worker that runs workspace workflows/. Publishes to the dev + prod Artifact
# Registries. PRs publish to dev only; master + manual runs publish to both.
# Each image is also tagged `runtime-<git tree of deploy/workflows/runtime>`:
# deploy-app.yml points the API's WORKFLOWS_RUNTIME_IMAGE at that tag, and the
# API moves worker pods to it when it starts (api/src/workflows/kube.ts).
on:
  push:
    branches: [master]
    paths:
      - "deploy/workflows/runtime/**"
      - ".github/workflows/workflows-runtime-image.yml"
  pull_request:
    paths:
      - "deploy/workflows/runtime/**"
      - ".github/workflows/workflows-runtime-image.yml"
  workflow_dispatch:

env:
  GCP_REGION: ${{ vars.GCP_REGION }}
  IMAGE_NAME: workflows-runtime

permissions:
  contents: read

concurrency:
  group: workflows-runtime-image-${{ github.ref }}
  # On master a cancelled build would leave its runtime tag unpublished, and
  # the app deploy waiting for it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-publish:
    name: Build + publish workflows runtime image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # One SA (GCP_DEV_SERVICE_ACCOUNT) has cross-project push access to both
      # the dev and prod Artifact Registries — same as the app deploy.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_DEV_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker ${GCP_REGION}-docker.pkg.dev --quiet

      - name: Resolve registries
        id: reg
        env:
          PROD_CONFIG: ${{ vars.GCP_PROD_DEPLOY_CONFIG }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          TREE=$(git rev-parse HEAD:deploy/workflows/runtime)
          DEV="${GCP_REGION}-docker.pkg.dev/${{ vars.GCP_DEV_PROJECT_ID }}/${{ vars.GCP_DEV_ARTIFACT_REPOSITORY }}/${IMAGE_NAME}"
          PROD_PROJECT=$(echo "${PROD_CONFIG}" | jq -er '.project_id')
          PROD_REPO=$(echo "${PROD_CONFIG}" | jq -er '.artifact_repository')
          PROD="${GCP_REGION}-docker.pkg.dev/${PROD_PROJECT}/${PROD_REPO}/${IMAGE_NAME}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "runtime=runtime-${TREE}" >> "$GITHUB_OUTPUT"
          echo "dev=${DEV}" >> "$GITHUB_OUTPUT"
          echo "prod=${PROD}" >> "$GITHUB_OUTPUT"
          echo "Dev registry:  ${DEV}"
          echo "Prod registry: ${PROD}"

      - name: Build image (context = repo root)
        run: |
          docker build \
            -f deploy/workflows/runtime/Dockerfile \
            -t runtime:${{ steps.reg.outputs.sha }} \
            .

      # Dev is published from PRs too: previews run `:latest` from the dev
      # registry, and a PR that changes the runtime must be testable on its
      # own preview. Prod is published from master and manual runs only.
      - name: Publish to dev registry
        run: |
          for TAG in "${{ steps.reg.outputs.sha }}" "${{ steps.reg.outputs.runtime }}" latest; do
            docker tag runtime:${{ steps.reg.outputs.sha }} ${{ steps.reg.outputs.dev }}:${TAG}
            docker push ${{ steps.reg.outputs.dev }}:${TAG}
          done

      - name: Publish to prod registry
        if: github.event_name != 'pull_request'
        run: |
          for TAG in "${{ steps.reg.outputs.sha }}" "${{ steps.reg.outputs.runtime }}" latest; do
            docker tag runtime:${{ steps.reg.outputs.sha }} ${{ steps.reg.outputs.prod }}:${TAG}
            docker push ${{ steps.reg.outputs.prod }}:${TAG}
          done

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Workflows runtime image published :whale:"
            echo "- \`${{ steps.reg.outputs.dev }}:${{ steps.reg.outputs.runtime }}\` (+ \`:${{ steps.reg.outputs.sha }}\`, \`:latest\`)"
            echo "- \`${{ steps.reg.outputs.prod }}:${{ steps.reg.outputs.runtime }}\` (+ \`:${{ steps.reg.outputs.sha }}\`, \`:latest\`)"
            echo ""
            echo "The app deploy points \`WORKFLOWS_RUNTIME_IMAGE\` at the runtime tag; worker pods move to it when the API starts."
          } >> "$GITHUB_STEP_SUMMARY"
