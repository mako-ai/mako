name: API Contract

# Two jobs, named for what actually fails in them:
#  - "OpenAPI contract + drift check": regenerates the OpenAPI spec and the
#    generated frontend types, then fails if either differs from what's
#    committed (so a route change can't ship without updating the spec +
#    client types); also runs the frontend typed client's own tests.
#  - "API tests (tsx + vitest)": every API suite — the tsx runner, the three
#    vitest configs, agent-tools, destinations, the edge worker. This used to
#    hide inside the contract job, so a unit-test failure read as "OpenAPI
#    drift" and got triaged as such twice (PRs #976, #979). The suites run
#    as parallel "API tests / <suite>" jobs; the "API tests (tsx + vitest)"
#    job, which the master ruleset requires, passes only when all of them do.

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "api/**"
      - "app/src/api/**"
      - "app/src/store/**"
      - "docs/src/openapi/**"
      - "packages/schemas/**"
      - "packages/agent-tools/**"
      - "packages/connector-sdk/**"
      - "connectors/**"
      - ".github/workflows/api-contract.yml"

jobs:
  contract:
    name: OpenAPI contract + drift check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Matches the API image (node:24-bookworm-slim). The workspace-
          # connector specs also need >= 22.18: they import a real connector,
          # which is TypeScript loaded without a build step (type stripping).
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Workspace packages the API imports at runtime must be built first so
      # `tsx` can resolve `@mako/schemas` / `@mako/agent-tools`.
      - name: Build workspace packages
        run: |
          pnpm --filter @mako/schemas run build
          pnpm --filter @mako/agent-tools run build

      - name: Frontend typed-client tests
        # Deliberately just the typed client, not the whole app suite: this
        # workflow exists to keep the OpenAPI contract honest, and the client
        # is the frontend half of that contract. The full frontend suite runs
        # in frontend-tests.yml, on app/src changes — running it here too
        # would double up on PRs touching both, and running ONLY it here would
        # leave api-only PRs with no client check at all.
        run: pnpm --filter app exec vitest run src/api/client.test.ts

      - name: Regenerate OpenAPI spec + frontend types
        run: pnpm run openapi:sync

      - name: Fail if the committed spec or generated types are stale
        run: |
          if ! git diff --exit-code -- docs/src/openapi/mako-api.json app/src/api/schema.d.ts; then
            echo "::error::OpenAPI spec or generated frontend types are out of date." \
              "Run 'pnpm run openapi:sync' and commit the result."
            exit 1
          fi

  api-tests-suite:
    name: API tests / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      # Every suite reports, as it did when they ran one after another.
      fail-fast: false
      matrix:
        suite: [tsx, apps, dbt, destinations, docker]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Matches the API image (node:24-bookworm-slim). The workspace-
          # connector specs also need >= 22.18: they import a real connector,
          # which is TypeScript loaded without a build step (type stripping).
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Workspace packages the API imports at runtime must be built first so
      # `tsx` can resolve `@mako/schemas` / `@mako/agent-tools`.
      - name: Build workspace packages
        run: |
          pnpm --filter @mako/schemas run build
          pnpm --filter @mako/agent-tools run build

      # worker-identity.db.test.ts runs the workflows runtime's own
      # lib/mako.ts, which imports the runtime's packages, as the image does.
      - name: Install workflows runtime packages
        run: npm install --prefix deploy/workflows/runtime --no-audit --no-fund

      # The connectors/<slug>/fixtures parity tests run each folder with its own
      # dependencies, installed from its own lockfile, as a box would.
      - name: Install connector folder packages
        run: |
          npm ci --prefix connectors/stripe --no-audit --no-fund --ignore-scripts
          npm ci --prefix connectors/close --no-audit --no-fund --ignore-scripts
          npm ci --prefix connectors/posthog --no-audit --no-fund --ignore-scripts
          npm ci --prefix connectors/pandadoc --no-audit --no-fund --ignore-scripts
          npm ci --prefix connectors/claap --no-audit --no-fund --ignore-scripts
          npm ci --prefix connectors/wise --no-audit --no-fund --ignore-scripts
          npm ci --prefix connectors/calendly --no-audit --no-fund --ignore-scripts
          npm ci --prefix connectors/graphql --no-audit --no-fund --ignore-scripts
          npm ci --prefix connectors/bigquery --no-audit --no-fund --ignore-scripts
          npm ci --prefix connectors/rest --no-audit --no-fund --ignore-scripts

      - name: App SDK version is published to npm
        if: matrix.suite == 'destinations'
        # Scaffolds depend on `@makoai/app-sdk@^<vendored version>` (from
        # packages/app-sdk/package.json). An unpublished bump makes every
        # new app's `npm install` fail, so the version must be on the
        # registry before it can ship — 2.3.0 sat in git unpublished for
        # five days once.
        run: |
          version=$(node -p "require('./packages/app-sdk/package.json').version")
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@makoai/app-sdk/$version")
          if [ "$status" != "200" ]; then
            echo "::error::@makoai/app-sdk@$version is not on npm (HTTP $status). Publish it (publish-npm.yml) before merging."
            exit 1
          fi
          echo "@makoai/app-sdk@$version is published"

      - name: API tsx suites
        if: matrix.suite == 'tsx'
        # The hand-rolled tsx + node:assert chain (first half of
        # api/package.json "test").
        run: pnpm --filter api run test:tsx

      - name: API apps vitest config
        if: matrix.suite == 'apps'
        # vitest.apps.config.ts (second half of api/package.json "test"):
        # apps, consoles, skills, flows, notebooks.
        run: pnpm --filter api run test:apps

      - name: API dbt vitest config
        if: matrix.suite == 'dbt'
        # vitest.config.ts — src/dbt/**, src/integrations/github/**, the dbt
        # route integration spec, the dbt-* agent tools, and anything else
        # that happens to live under src/dbt. The real-dbt engine contract
        # self-skips without RUN_DBT_ENGINE_CONTRACT.
        run: pnpm --filter api run test:dbt

      - name: API destination tests
        if: matrix.suite == 'destinations'
        # Offline destination connector suite (driver dialect/write SQL, CDC
        # MERGE builder, DestinationWriter orchestration). Real-DB integration
        # specs self-skip without RUN_DB_INTEGRATION (see destination-integration.yml).
        run: pnpm --filter api run test:destinations

      - name: Connector run isolation (Docker)
        if: matrix.suite == 'docker'
        # The per-run Unix user scripts the API sends to E2B, run as-is in
        # E2B's own e2bdev/base image: concurrent runs, symlink attacks,
        # pthread_exit and non-dumpable survivors, a failed kill, the next
        # run's credential. Read sessions too: a concurrent thief, leftovers
        # after the read, an API that dies mid-read, a dead supervisor reaped.
        # GitHub's ubuntu runners have Docker.
        env:
          RUN_CONNECTOR_ISOLATION_DOCKER: "1"
        run: pnpm --filter api exec vitest run --config vitest.destinations.config.ts src/connectors/workspace/run-isolation.docker.test.ts src/connectors/workspace/session-isolation.docker.test.ts src/connectors/workspace/webhook-batch.docker.test.ts

      - name: Agent tools tests
        if: matrix.suite == 'dbt'
        run: pnpm --filter @mako/agent-tools run test

      - name: Cloudflare app-router tests
        if: matrix.suite == 'dbt'
        # Maintenance-mode edge worker: raw webhook body forwarding, operator
        # bypass, redirect rewriting, response streaming.
        run: pnpm run cf:app:test

  api-tests:
    # The master ruleset requires this check name. It passes only when every
    # suite above passed (a failed, cancelled or skipped suite fails it).
    name: API tests (tsx + vitest)
    needs: api-tests-suite
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every API test suite passed
        run: test "${{ needs.api-tests-suite.result }}" = success
