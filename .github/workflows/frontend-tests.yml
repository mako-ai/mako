name: Frontend tests

# Frontend unit tests are required by the master branch ruleset. Run them on
# every pull request so API-only changes do not wait for a check that path
# filters prevent from starting.
#
# api-contract.yml is the only other workflow that runs tests on a pull
# request, and it is a heavy job: the api tsx chain, agent-tools, the
# destination suite, dbt, and an OpenAPI regenerate-and-diff. Widening ITS
# path filter to cover app/src would give frontend changes behavioural
# coverage, but at the cost of running all of that for a one-line CSS change.
#
# This runs the 436 frontend assertions on their own — no workspace build is
# needed, because @mako/schemas and @mako/agent-tools both expose
# `"import": "./src/index.ts"`, so vitest resolves them to source rather than
# to a built dist. That is what keeps this job to an install plus a couple of
# seconds.
#
# Deliberately NOT covered here, and deliberately left to api-contract.yml:
# the OpenAPI contract and the generated typed client. Those are already
# handled, because app/src/api/** and app/src/store/** are in that workflow's
# path filter — so a change to the hand-written client, the generated schema,
# or the stores still triggers the drift check as it does today.

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  frontend:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend tests
        run: pnpm --filter app run test:unit

  # The CLI (`mako login`, `mako dev`, `mako workflow run`, …) is published to
  # npm from packages/cli; its node:test suite needs only the install too.
  cli:
    name: CLI tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: CLI tests
        run: pnpm --filter @makoai/cli test

      # node --test in packages/app-sdk: the Vite plugin, the UI helpers and
      # the golden row-decoder test against real apache-arrow.
      - name: App SDK tests
        run: pnpm --filter @makoai/app-sdk test

      # The CLI supports Node 22 (`engines`): `mako workflow run` must load a
      # workflow's TypeScript there too, including 22.12-22.17, where Node
      # does not strip types by default. --no-experimental-strip-types stands
      # in for those on a patched 22.x (Node 20 is end-of-life).
      # (`mako connector test` needs Node 22.18+ and says so; not run here.)
      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: mako workflow run tests on Node 22 without type stripping
        working-directory: packages/cli
        run: node --no-experimental-strip-types --test src/workflow.test.mjs
