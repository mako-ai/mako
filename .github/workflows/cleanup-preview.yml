name: Cleanup PR Preview

on:
  pull_request:
    types: [closed]
  # Nightly sweep: catches previews the close-event cleanup missed (workflow
  # failures, PRs closed before the workflow existed, manual deploys, etc.)
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  cleanup:
    name: Cleanup PR #${{ github.event.pull_request.number }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      SERVICE_NAME: mako-pr-${{ github.event.pull_request.number }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_DEV_SERVICE_ACCOUNT }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_ORG_ID: ${{ secrets.NEON_ORG_ID }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      NEON_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME || 'neondb' }}
      NEON_ROLE_NAME: ${{ vars.NEON_ROLE_NAME || 'neondb_owner' }}
      NEON_POOLED: ${{ vars.NEON_POOLED || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # On pull_request: closed, default checkout may be the merge commit or default branch.
          # Pin to the PR head SHA so git diff sees the PR's actual changes.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Delete Cloud Run service
        continue-on-error: true
        run: |
          echo "Deleting Cloud Run service: ${SERVICE_NAME}"
          gcloud run services delete ${SERVICE_NAME} \
            --region ${GCP_REGION} \
            --quiet || echo "Service ${SERVICE_NAME} not found or already deleted"

      - name: Delete Docker images from Artifact Registry
        continue-on-error: true
        run: |
          IMAGE_NAME="mako-pr-${PR_NUMBER}"
          IMAGE_PATH="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/${IMAGE_NAME}"

          echo "Deleting Docker images: ${IMAGE_PATH}"

          # List and delete all tags for this image
          gcloud artifacts docker images list ${IMAGE_PATH} --format='get(DIGEST)' 2>/dev/null | while read digest; do
            if [ -n "$digest" ]; then
              echo "Deleting image with digest: ${digest}"
              gcloud artifacts docker images delete "${IMAGE_PATH}@${digest}" --quiet --delete-tags || true
            fi
          done

          echo "Image cleanup complete"

      - name: Remove from Cloudflare KV
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: |
          echo "Removing PR #${PR_NUMBER} from Cloudflare KV"
          curl -X DELETE "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${CLOUDFLARE_KV_NAMESPACE_ID}/values/${PR_NUMBER}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --fail-with-body || echo "KV entry not found or already deleted"

      - name: Delete Neon branch
        id: neon-delete
        continue-on-error: true
        run: node scripts/neon.mjs delete-pr

      - name: Check for ephemeral database
        id: check-migrations
        run: |
          # Check if this PR had migration changes (would have used ephemeral DB)
          MIGRATION_CHANGES=$(git diff "origin/${{ github.event.pull_request.base.ref }}"...HEAD --name-only -- 'api/src/migrations/*.ts' 2>/dev/null | wc -l | tr -d ' ' || echo "0")
          if [ "$MIGRATION_CHANGES" -gt 0 ]; then
            echo "has_ephemeral_db=true" >> $GITHUB_OUTPUT
          else
            echo "has_ephemeral_db=false" >> $GITHUB_OUTPUT
          fi

      - name: Install MongoDB tools
        if: steps.check-migrations.outputs.has_ephemeral_db == 'true'
        run: |
          wget -qO- https://www.mongodb.org/static/pgp/server-7.0.asc | sudo gpg --dearmor -o /usr/share/keyrings/mongodb.gpg
          echo "deb [signed-by=/usr/share/keyrings/mongodb.gpg] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-mongosh

      - name: Delete ephemeral database
        if: steps.check-migrations.outputs.has_ephemeral_db == 'true'
        continue-on-error: true
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          echo "Deleting ephemeral database for PR #${PR_NUMBER}"
          # Extract the connection string base and target the PR-specific database
          # Format the database name
          DB_NAME="staging_pr_${PR_NUMBER}"

          # Drop the database
          mongosh "$STAGING_DATABASE_URL" --eval "db.getSiblingDB('${DB_NAME}').dropDatabase()" || echo "Database not found or already deleted"

      - name: Comment on PR
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const wasMerged = context.payload.pull_request.merged;
            const hadEphemeralDb = '${{ steps.check-migrations.outputs.has_ephemeral_db }}' === 'true';
            // Report the real outcome — the step is continue-on-error, so a
            // failed delete must not be reported as "Deleted" (Neon branches
            // still expire via expires_at as a safety net).
            const neonOutcome = '${{ steps.neon-delete.outcome }}' === 'success'
              ? ('${{ steps.neon-delete.outputs.deleted }}' === 'false' ? 'Not found (already deleted)' : 'Deleted')
              : '⚠️ Delete failed — will auto-expire';

            const status = wasMerged ? '✅ Merged' : '❌ Closed';

            const body = `## 🧹 Preview Cleanup Complete

            | Resource | Status |
            |----------|--------|
            | Cloud Run Service | Deleted |
            | Docker Images | Deleted |
            | Cloudflare KV Entry | Removed |
            | Neon Branch | ${neonOutcome} |
            ${hadEphemeralDb ? '| Ephemeral Database | Dropped |' : ''}

            PR was ${status.toLowerCase()}.
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body,
            });

  # Nightly sweep of orphaned preview resources. The per-PR cleanup job above
  # handles the happy path; this catches anything it missed.
  sweep:
    name: Sweep stale PR previews
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_DEV_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: List open PRs
        run: |
          gh pr list --repo "${{ github.repository }}" --state open --limit 500 \
            --json number --jq '.[].number' | sort > /tmp/open_prs.txt
          echo "Open PRs: $(wc -l < /tmp/open_prs.txt)"

      - name: Delete Cloud Run services for closed PRs
        run: |
          gcloud run services list --region "${GCP_REGION}" \
            --format='value(metadata.name)' \
            | grep '^mako-pr-' | sed 's/^mako-pr-//' | sort > /tmp/service_prs.txt || true

          comm -23 /tmp/service_prs.txt /tmp/open_prs.txt > /tmp/stale_service_prs.txt
          echo "Stale services: $(wc -l < /tmp/stale_service_prs.txt)"

          while read -r pr; do
            [ -z "$pr" ] && continue
            echo "Deleting Cloud Run service mako-pr-${pr}"
            gcloud run services delete "mako-pr-${pr}" \
              --region "${GCP_REGION}" --quiet \
              || echo "::warning::Failed to delete service mako-pr-${pr}"
          done < /tmp/stale_service_prs.txt

      - name: Delete Artifact Registry images for closed PRs
        run: |
          gcloud artifacts docker images list \
            "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${{ vars.GCP_ARTIFACT_REPOSITORY }}" \
            --format='value(package)' 2>/dev/null \
            | sort -u | grep '/mako-pr-' | sed 's|.*/mako-pr-||' | sort > /tmp/image_prs.txt || true

          comm -23 /tmp/image_prs.txt /tmp/open_prs.txt > /tmp/stale_image_prs.txt
          echo "Stale image packages: $(wc -l < /tmp/stale_image_prs.txt)"

          while read -r pr; do
            [ -z "$pr" ] && continue
            echo "Deleting image package mako-pr-${pr}"
            gcloud artifacts packages delete "mako-pr-${pr}" \
              --repository="${{ vars.GCP_ARTIFACT_REPOSITORY }}" \
              --location="${GCP_REGION}" --quiet \
              || echo "::warning::Failed to delete image package mako-pr-${pr}"
          done < /tmp/stale_image_prs.txt

      - name: Delete ephemeral databases for closed PRs
        continue-on-error: true
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          wget -qO- https://www.mongodb.org/static/pgp/server-7.0.asc | sudo gpg --dearmor -o /usr/share/keyrings/mongodb.gpg
          echo "deb [signed-by=/usr/share/keyrings/mongodb.gpg] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq mongodb-mongosh

          mongosh "$STAGING_DATABASE_URL" --quiet --eval "
            const dbs = db.adminCommand({ listDatabases: 1 }).databases;
            dbs.filter(d => d.name.startsWith('staging_pr_')).forEach(d => print(d.name));
          " | sed 's/^staging_pr_//' | sort > /tmp/db_prs.txt || true

          comm -23 /tmp/db_prs.txt /tmp/open_prs.txt > /tmp/stale_db_prs.txt
          echo "Stale ephemeral DBs: $(wc -l < /tmp/stale_db_prs.txt)"

          while read -r pr; do
            [ -z "$pr" ] && continue
            echo "Dropping database staging_pr_${pr}"
            mongosh "$STAGING_DATABASE_URL" --quiet \
              --eval "db.getSiblingDB('staging_pr_${pr}').dropDatabase()" \
              || echo "::warning::Failed to drop database staging_pr_${pr}"
          done < /tmp/stale_db_prs.txt
