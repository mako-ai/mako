name: Claude Code

# Two jobs:
#   claude       answers @claude mentions in issues, PR comments and reviews.
#   auto-review  reviews every non-draft pull request with Anthropic's
#                official code-review plugin and posts the findings on the PR.
#
# Setup follows https://code.claude.com/docs/en/github-actions (the "Run a
# skill" review example). No model is pinned: the action uses the Claude Code
# default model, so this file does not go stale when a new model ships.
#
# Public repo rules:
#   - GitHub withholds secrets from fork pull requests, so auto-review runs
#     only on branches of this repository. Never mirror a fork branch into
#     this repository to work around that: it would hand an outsider's code
#     our secrets.
#   - No `allowed_bots`: only people with write access trigger a run.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]
  pull_request:
    # No `synchronize`: the plugin skips a pull request that already carries a
    # Claude comment, so a run on every push would start a runner for nothing.
    # Ask for another pass with an `@claude review the new commits` comment.
    types: [opened, reopened, ready_for_review]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

  auto-review:
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-auto-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # Review only: read access. The action posts comments as the Claude GitHub
    # App, which it reaches through `id-token: write`.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          # `--comment` makes the plugin post on the pull request: one inline
          # comment per finding, or one summary comment when it finds none.
          # Without it the review stays in the run log. House rules for the
          # reviewer live in CLAUDE.md, which the plugin reads.
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Keep this line: the action starts the MCP server that posts inline
          # comments only when --allowedTools names it here.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
