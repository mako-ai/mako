name: Claude Code

# Three jobs:
#   claude       answers @claude mentions in issues, PR comments and reviews.
#   auto-review  first pass: reviews a non-draft pull request when it opens,
#                with Anthropic's official code-review plugin, and posts the
#                findings on the PR.
#   re-review    second pass: on every later push, reviews only the new
#                commits and posts only findings that are new.
#
# Setup follows https://code.claude.com/docs/en/github-actions (the "Run a
# skill" review example). No model is pinned: the action uses the Claude Code
# default model, so this file does not go stale when a new model ships.
#
# Public repo rules:
#   - GitHub withholds secrets from fork pull requests, so auto-review runs
#     only on branches of this repository. Never mirror a fork branch into
#     this repository to work around that: it would hand an outsider's code
#     our secrets.
#   - No `allowed_bots`: only people with write access trigger a run.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]
  pull_request:
    # opened / reopened / ready_for_review start auto-review. synchronize (a
    # push to the branch) starts re-review: the plugin skips a pull request
    # that already carries a Claude comment, so it cannot do the second pass.
    types: [opened, reopened, ready_for_review, synchronize]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

  auto-review:
    if: |
      github.event_name == 'pull_request' &&
      github.event.action != 'synchronize' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-auto-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # Review only: read access to the code. The action posts its findings as
    # the Claude GitHub App, which it reaches through `id-token: write`.
    # `pull-requests: write` serves one step: the report below, which says so
    # on the pull request when a review ran and posted nothing.
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Note the start time
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        id: review
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          # `--comment` makes the plugin post on the pull request: one inline
          # comment per finding, or one summary comment when it finds none.
          # Without it the review stays in the run log. House rules for the
          # reviewer live in CLAUDE.md, which the plugin reads.
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Keep this line: the action starts the MCP server that posts inline
          # comments only when --allowedTools names it here.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
      # A review that runs and says nothing must not look like a pass. The
      # action keeps Claude's final message in its run log: copy it to the run
      # summary, and when Claude posted nothing on the pull request, say so
      # there with that message.
      - name: Report what the review did
        if: always() && steps.review.conclusion != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXEC_FILE: ${{ steps.review.outputs.execution_file }}
          STARTED_AT: ${{ steps.start.outputs.at }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PASS: first pass
          COMMENT_WHEN_SILENT: "true"
        run: |
          set -euo pipefail
          final=''
          if [ -n "${EXEC_FILE:-}" ] && [ -f "$EXEC_FILE" ]; then
            final=$(jq -rs '
              (flatten) as $m
              | ( [ $m[] | select(.type=="result") | .result ] | last )
                // ( [ $m[] | select(.type=="assistant")
                      | .message.content[]? | select(.type=="text") | .text ] | last )
                // ""
            ' "$EXEC_FILE" 2>/dev/null || true)
          fi
          [ -n "$final" ] || final='(the run left no final message)'
          count() {
            gh api "repos/$REPO/$1" --paginate \
              -q "[.[] | select(.user.login == \"claude[bot]\" and .created_at >= \"$STARTED_AT\")] | length" \
              | awk '{s+=$1} END {print s+0}'
          }
          inline=$(count "pulls/$PR_NUMBER/comments")
          summary=$(count "issues/$PR_NUMBER/comments")
          {
            echo "## Claude review, $PASS"
            echo
            echo "- Commit: \`${HEAD_SHA:0:8}\`"
            echo "- Inline findings posted: $inline"
            echo "- Summary comments posted: $summary"
            echo
            echo "### Final message"
            echo
            printf '%s\n' "$final" | head -c 6000
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$COMMENT_WHEN_SILENT" = 'true' ] && [ "$inline" = '0' ] && [ "$summary" = '0' ]; then
            {
              echo "**Automated review: no findings were posted on \`${HEAD_SHA:0:8}\`.**"
              echo
              echo "The $PASS ran and left no comment. This is not a pass: read the final message below."
              echo
              echo '<details><summary>Final message of the run</summary>'
              echo
              printf '%s\n' "$final" | head -c 6000
              echo
              echo '</details>'
              echo
              echo "[Run log]($RUN_URL). Ask for a review with an \`@claude review this pull request\` comment."
            } > "$RUNNER_TEMP/silent.md"
            gh pr comment "$PR_NUMBER" -R "$REPO" --body-file "$RUNNER_TEMP/silent.md"
          fi

  re-review:
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same group as auto-review: a push cancels a review of the older commit.
    concurrency:
      group: ${{ github.workflow }}-auto-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Plain code gathers what the model needs, so the model gets no broad
      # GitHub API tool: the range of new commits, and every existing review
      # thread with its resolved state.
      - name: Collect new commits and existing review threads
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # After a force push or rebase the old head is gone or is no longer an
          # ancestor: fall back to the whole pull request diff.
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "$BEFORE" "$AFTER"; then
            range="$BEFORE..$AFTER"
            scope=incremental
          else
            range="$(git merge-base "$BASE_SHA" "$AFTER")..$AFTER"
            scope=full
          fi
          # A push that only merges the base branch brings no change of its own.
          own=$(git log --no-merges --format=%H "$range" | wc -l | tr -d ' ')
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "own_commits=$own" >> "$GITHUB_OUTPUT"
          gh api graphql --paginate \
            -f owner="$OWNER" -f name="$NAME" -F number="$PR_NUMBER" \
            -f query='
              query($owner: String!, $name: String!, $number: Int!, $endCursor: String) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    reviewThreads(first: 100, after: $endCursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        isResolved
                        isOutdated
                        path
                        line
                        comments(first: 20) { nodes { author { login } body } }
                      }
                    }
                  }
                }
              }' \
            --jq '.data.repository.pullRequest.reviewThreads.nodes[]
                  | {resolved: .isResolved, outdated: .isOutdated, path, line,
                     comments: [.comments.nodes[] | {author: .author.login, body}]}' \
            > "$RUNNER_TEMP/review-threads.jsonl"
          cp "$RUNNER_TEMP/review-threads.jsonl" .claude-review-threads.jsonl
          echo "threads=$(wc -l < .claude-review-threads.jsonl | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - name: Note the start time
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        id: review
        if: steps.context.outputs.own_commits != '0'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            NEW COMMITS: ${{ steps.context.outputs.range }} (${{ steps.context.outputs.scope }})

            This pull request was reviewed before. New commits were pushed. Do
            a second pass on the new commits only. The pull request branch is
            checked out in the current directory. CLAUDE.md holds the house
            rules.

            Read first:
            - `.claude-review-threads.jsonl`: every existing review thread on
              this pull request, one JSON object per line, with `resolved`,
              `outdated`, `path`, `line` and its comments.
            - `git log --no-merges NEW COMMITS` and `git diff NEW COMMITS` for
              what changed. Changes that only come from merging the base
              branch are out of scope. When the scope is `full` (a force push
              or rebase), the range is the whole pull request: review it all,
              and still apply the rules below.

            Flag only HIGH SIGNAL issues in the changed lines: code that will
            not compile or parse, clear logic errors, security holes, and
            unambiguous CLAUDE.md violations you can quote. No style nits, no
            speculation, nothing a linter or the type checker reports. Verify
            each issue against the code before posting it: read the
            surrounding file, do not guess from the diff alone.

            Never repeat a finding:
            - Do not raise an issue an existing thread already covers, whoever
              wrote it and whether or not it is fixed.
            - A resolved thread is a decision by the author. Do not raise the
              same point again, even if the code did not change.
            - Do not comment on a previous finding that is now fixed.
            - If a new commit introduces a regression of something a thread
              marked fixed, that is a new issue: flag it.

            Post each new issue as one inline comment on the changed line with
            `mcp__github_inline_comment__create_inline_comment`, with
            `confirmed: true`: what is wrong, why it matters, and a suggestion
            block only when the fix is small and complete. If you find nothing
            new, post nothing and end with the sentence "No new issues in the
            new commits."
          claude_args: |
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
      # The second pass stays silent on the pull request when it finds nothing
      # new. The run summary still shows its final message and its counts.
      - name: Report what the review did
        if: always() && steps.review.conclusion != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXEC_FILE: ${{ steps.review.outputs.execution_file }}
          STARTED_AT: ${{ steps.start.outputs.at }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PASS: second pass
          COMMENT_WHEN_SILENT: "false"
        run: |
          set -euo pipefail
          final=''
          if [ -n "${EXEC_FILE:-}" ] && [ -f "$EXEC_FILE" ]; then
            final=$(jq -rs '
              (flatten) as $m
              | ( [ $m[] | select(.type=="result") | .result ] | last )
                // ( [ $m[] | select(.type=="assistant")
                      | .message.content[]? | select(.type=="text") | .text ] | last )
                // ""
            ' "$EXEC_FILE" 2>/dev/null || true)
          fi
          [ -n "$final" ] || final='(the run left no final message)'
          count() {
            gh api "repos/$REPO/$1" --paginate \
              -q "[.[] | select(.user.login == \"claude[bot]\" and .created_at >= \"$STARTED_AT\")] | length" \
              | awk '{s+=$1} END {print s+0}'
          }
          inline=$(count "pulls/$PR_NUMBER/comments")
          summary=$(count "issues/$PR_NUMBER/comments")
          {
            echo "## Claude review, $PASS"
            echo
            echo "- Commit: \`${HEAD_SHA:0:8}\`"
            echo "- Inline findings posted: $inline"
            echo "- Summary comments posted: $summary"
            echo
            echo "### Final message"
            echo
            printf '%s\n' "$final" | head -c 6000
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$COMMENT_WHEN_SILENT" = 'true' ] && [ "$inline" = '0' ] && [ "$summary" = '0' ]; then
            {
              echo "**Automated review: no findings were posted on \`${HEAD_SHA:0:8}\`.**"
              echo
              echo "The $PASS ran and left no comment. This is not a pass: read the final message below."
              echo
              echo '<details><summary>Final message of the run</summary>'
              echo
              printf '%s\n' "$final" | head -c 6000
              echo
              echo '</details>'
              echo
              echo "[Run log]($RUN_URL). Ask for a review with an \`@claude review this pull request\` comment."
            } > "$RUNNER_TEMP/silent.md"
            gh pr comment "$PR_NUMBER" -R "$REPO" --body-file "$RUNNER_TEMP/silent.md"
          fi
