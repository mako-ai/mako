packages:
  - .
  - app
  - api
  - docs
  - packages/*
allowBuilds:
  '@mui/x-telemetry': false
  bcrypt: false
  core-js: false
  cpu-features: false
  electron: true
  electron-winstaller: false
  es5-ext: false
  esbuild: true
  mongodb-memory-server: false
  protobufjs: false
  sharp: false
  ssh2: true
  workerd: false
ignoredBuiltDependencies:
  - bcrypt
# 24h supply-chain gate. The Docker build's pnpm (latest) enforces this by
# default; declaring it here makes local resolution match CI so a fresh
# install can't pin hours-old releases into the lockfile.
minimumReleaseAge: 1440
