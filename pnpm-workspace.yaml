packages:
  - .
  - app
  - api
  - docs
  - packages/*
allowBuilds:
  '@mui/x-telemetry': false
  bcrypt: false
  core-js: false
  cpu-features: false
  electron: true
  electron-winstaller: false
  es5-ext: false
  esbuild: true
  mongodb-memory-server: false
  protobufjs: false
  sharp: false
  ssh2: true
  workerd: false
ignoredBuiltDependencies:
  - bcrypt
# 24h supply-chain gate: a fresh resolution can't pin hours-old releases into
# the lockfile. Needs pnpm >= 10.16; local, CI and the Docker image all run the
# version pinned by `packageManager` in the root package.json. Renovate's
# minimumReleaseAge (renovate.json) matches it.
minimumReleaseAge: 1440
overrides:
  # `next` is only an optional peer of inngest (its Next.js serve adapter).
  # Mako serves Inngest through Hono, so drop it: it was 100 MB of the
  # Cloud Run image and most of the critical audit findings.
  inngest>next: '-'
  # Floor transitive copies at the first patched release of each major
  # (TLS-validation bypass, DoS, cache poisoning). Drop these once the
  # parents (cheerio, e2b, @ai-sdk/provider-utils, axios) require them.
  undici@>=6.0.0 <6.29.1: ^6.29.1
  undici@>=7.0.0 <7.30.1: ^7.30.1
  undici@>=8.0.0 <8.12.2: ^8.12.4
  follow-redirects@<1.16.2: ^1.16.2
  # e2b ships an exact npm:undici@8.11.2 alias as an optional dependency.
  e2b>undici8: npm:undici@^8.12.4
  # Same-major floors for the remaining high/critical transitive findings
  # (aws-sdk via mongodb, express via the MCP SDK, inngest's otel host
  # metrics, ajv, docs' httpsnippet).
  fast-xml-parser@>=4.0.0 <4.5.5: ^4.5.5
  body-parser@>=2.0.0 <2.4.0: ^2.4.0
  systeminformation@<5.33.16: ^5.33.16
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  form-data@>=4.0.0 <4.0.6: ^4.0.6
  # mssql>tedious pins an @azure/identity whose msal-node (6.x) has a high
  # advisory; identity 4.14 moves to the patched msal-node 7.
  '@azure/identity@>=4.0.0 <4.14.1': ^4.14.1
  # monaco-editor 0.55 pins dompurify 3.2.7 exactly (high advisory
  # GHSA-mrv2-3pqr-j5jr); Monaco only uses it to sanitize hover markdown.
  dompurify@<3.4.17: ^3.4.17
# Audit exceptions. GHSA-fc5q-39xc-vjpf (picomatch ReDoS, high): docs-only
# path via astro/starlight; remove when picomatch >4.0.7 ships a fix
# (added 2026-11-17).
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
