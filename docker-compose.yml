# Local development services.
#
# Runs the notebook Python kernel so `code` cells execute
# locally: the API's StaticKernelProvider (KERNEL_GATEWAY_URL, see .env.example)
# drives this sidecar's Jupyter Kernel Gateway. In deployed environments the
# GKE KernelProvider is used instead — this is dev-only.
#
# Also runs Hatchet Lite (+ its Postgres) for workspace workflows
# (rfcs/workflows-as-code.md). Dashboard and REST API: http://localhost:8085
# (admin@example.com / Admin123!!), gRPC: localhost:7077.
#
# The dev database is hosted MongoDB Atlas (via DATABASE_URL), so it is not a
# compose service.
#
# Usage:
#   pnpm docker:up      # build (first run) + start the kernel
#   pnpm docker:logs    # follow logs
#   pnpm docker:down    # stop
services:
  notebook-kernel:
    build:
      # Build from source so no GCP/registry auth is needed. Context is the
      # repo root because the image bundles packages/mako-sdk-py.
      context: .
      dockerfile: packages/kernel-image/Dockerfile
    image: mako-notebook-kernel:local
    container_name: mako-notebook-kernel
    ports:
      - "8888:8888"
    # Lets the kernel reach the host API for mako.sources.sql.read (the session
    # injects MAKO_API_URL=NOTEBOOK_KERNEL_API_URL=http://host.docker.internal:8080).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  hatchet-postgres:
    image: postgres:16-alpine
    container_name: mako-hatchet-postgres
    environment:
      POSTGRES_USER: hatchet
      POSTGRES_PASSWORD: hatchet
      POSTGRES_DB: hatchet
    volumes:
      - hatchet-postgres:/var/lib/postgresql/data
    restart: unless-stopped

  hatchet:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:v0.107.0
    container_name: mako-hatchet
    depends_on:
      - hatchet-postgres
    ports:
      - "8085:8888"
      - "7077:7077"
    environment:
      DATABASE_URL: postgresql://hatchet:hatchet@hatchet-postgres:5432/hatchet?sslmode=disable
      SERVER_URL: http://localhost:8085
      SERVER_AUTH_COOKIE_DOMAIN: localhost
      SERVER_AUTH_COOKIE_INSECURE: "t"
      SERVER_AUTH_SET_EMAIL_VERIFIED: "t"
      SERVER_GRPC_PORT: "7077"
      SERVER_GRPC_BIND_ADDRESS: 0.0.0.0
      SERVER_GRPC_INSECURE: "t"
      SERVER_GRPC_BROADCAST_ADDRESS: localhost:7077
      SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: localhost:7077
      SERVER_DEFAULT_ENGINE_VERSION: V1
    restart: unless-stopped

volumes:
  hatchet-postgres:
